<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prosta wyszukiwarka polskich adresów korzystająca z Azure Maps Search API."
    />
    <title>GdzieTo? — wyszukiwarka adresów</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header class="hero">
        <div class="topbar">
          <div class="brand" aria-label="GdzieTo?">
            <span class="brand-mark" aria-hidden="true">⌖</span>
            <span>GdzieTo?</span>
          </div>
          <div class="settings">
            <button id="settings-button" class="settings-button" type="button" aria-expanded="false" aria-controls="settings-panel">
              Opcje
            </button>
            <div id="settings-panel" class="settings-panel" hidden>
              <label class="toggle">
                <input id="autocomplete-toggle" type="checkbox" />
                <span>Autocomplete</span>
              </label>
              <label class="toggle">
                <input id="render-toggle" type="checkbox" />
                <span>Rendering mapy</span>
              </label>
            </div>
          </div>
        </div>
        <div class="hero-copy">
          <p class="eyebrow">Wyszukiwarka adresów w Polsce</p>
          <h1>Znajdź właściwe miejsce.</h1>
          <p class="intro">
            Wpisz ulicę, numer, kod pocztowy lub miasto. Przeszukamy dla Ciebie całą Polskę.
          </p>
        </div>

        <form id="search-form" class="search" role="search">
          <label for="query">Adres</label>
          <div class="search-row">
            <span class="search-icon" aria-hidden="true"></span>
            <input
              id="query"
              name="query"
              type="search"
              minlength="3"
              maxlength="200"
              placeholder="np. Marszałkowska 1, Warszawa"
              autocomplete="street-address"
              required
            />
            <button type="submit">
              <span>Szukaj</span>
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <ol id="suggestions" class="suggestions" aria-label="Podpowiedzi adresów" hidden></ol>
          <p class="hint">Spróbuj: <button type="button" class="example">Rynek Główny 1, Kraków</button></p>
        </form>
      </header>

      <section id="results-section" class="results-section" aria-live="polite" hidden>
        <div class="results-heading">
          <div>
            <p class="eyebrow">Wyniki wyszukiwania</p>
            <h2 id="results-title">Znalezione adresy</h2>
          </div>
          <span id="results-count" class="count"></span>
        </div>
        <div id="status" class="status"></div>
        <ol id="results" class="results"></ol>
      </section>
    </main>

    <footer>
      <span>Wyniki dostarcza Azure Maps</span>
      <span aria-hidden="true">•</span>
      <span>Tylko adresy w Polsce</span>
    </footer>
  </body>
</html>
